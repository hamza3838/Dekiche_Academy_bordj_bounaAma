<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول المشرف - أكاديمية دقيش</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; direction: rtl; }
        .login-card { background: #1e293b; border: 1px solid rgba(233, 189, 104, 0.3); border-radius: 20px; padding: 35px; width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        .login-card h2 { color: #e9bd68; font-size: 22px; font-weight: 700; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; }
        .alert { padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 13px; font-weight: 600; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; text-align: right; }
        .form-group { margin-bottom: 18px; text-align: right; }
        .form-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
        .form-group input { width: 100%; padding: 14px; background: #0f172a; border: 1px solid #334155; color: #f8fafc; border-radius: 12px; font-size: 14px; outline: none; transition: 0.2s; }
        .form-group input:focus { border-color: #e9bd68; }
        .btn-submit { background: #e9bd68; color: #0f172a; padding: 14px; border: none; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; transition: 0.2s; margin-top: 5px; }
        .btn-submit:hover { filter: brightness(1.1); }
        .back-link { margin-top: 20px; display: inline-block; color: #94a3b8; font-size: 14px; text-decoration: none; transition: 0.2s; }
        .back-link:hover { color: #e9bd68; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>لوحة تحكم المشرف</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for cat, msg in messages %}
                    <div class="alert">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>كلمة مرور المشرف:</label>
                <input type="password" name="password" placeholder="أدخل كلمة المرور" required>
            </div>
            <button type="submit" class="btn-submit">دخول للمنصة</button>
        </form>

        <a href="/" class="back-link">العودة للرئيسية</a>
    </div>

    <!-- كود لحفظ واسترجاع كلمة المرور تلقائياً في المتصفح -->
    <script>
    window.addEventListener('DOMContentLoaded', () => {
        const savedAdminPass = localStorage.getItem('daqiche_admin_password');
        if (savedAdminPass) {
            const passInput = document.querySelector('input[name="password"]');
            if (passInput) passInput.value = savedAdminPass;
        }
    });

    const adminForm = document.querySelector('form');
    if (adminForm) {
        adminForm.addEventListener('submit', () => {
            const passInput = document.querySelector('input[name="password"]');
            if (passInput && passInput.value.trim()) {
                localStorage.setItem('daqiche_admin_password', passInput.value.trim());
            }
        });
    }
    </script>
</body>
</html>
