<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فضاء التلميذ - أكاديمية دقيش</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .header { background: white; padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .lesson-card { background: white; padding: 20px; border-radius: 12px; margin-top: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; margin-top: 15px; }
        .video-container iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:0; }
        .logout { background: #d93025; color: white; padding: 6px 15px; text-decoration: none; border-radius: 6px; font-size: 14px; }
        h3 { color: #1a73e8; margin-top: 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h2>أهلاً بك، {{ student_name }}</h2>
                <p style="margin: 0; color: #666;">مستواك المتاح: <strong>الشهر رقم {{ student_month }}</strong></p>
            </div>
            <a href="/logout" class="logout">خروج</a>
        </div>

        {% if lessons %}
            {% for lesson in lessons %}
            <div class="lesson-card">
                <h3>{{ lesson.title }}</h3>
                <div class="video-container">
                    <iframe src="{{ lesson.youtube_url }}" allowfullscreen></iframe>
                </div>
            </div>
            {% endfor %}
        {% else %}
            <div class="lesson-card" style="text-align: center; color: #666;">
                <p>لا توجد دروس متاحة حالياً لهذا الشهر. ترقب الجديد قريبًا!</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
