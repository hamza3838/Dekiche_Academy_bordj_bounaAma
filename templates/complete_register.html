<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إكمال التسجيل - أكاديمية دقيش</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #f4f7f6; font-family: 'Tajawal', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #0d6efd; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; text-align: right; }
        button { background: #0d6efd; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0b5ed7; }
        p { color: #666; font-size: 0.9rem; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>أهلاً بك يا بطل!</h2>
        <p>يرجى إدخال اسمك الكامل ورقم الهاتف لمتابعة الدروس:</p>
        <form action="{{ url_for('complete_register') }}" method="POST">
            <input type="hidden" name="code" value="{{ code }}">
            <input type="text" name="full_name" placeholder="الاسم واللقب (مثال: محمد الأمين)" required>
            <input type="tel" name="phone" placeholder="رقم الهاتف (ولي الأمر أو التلميذ)" required>
            <button type="submit">دخول إلى المنصة</button>
        </form>
    </div>
</body>
</html>
