<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - أكاديمية دقيش</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; text-align: center; padding-top: 100px; }
        .login-box { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input, button { padding: 10px; margin: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>تسجيل الدخول إلى الأكاديمية</h2>
        <form method="POST">
            <input type="text" name="code" placeholder="أدخل رمز الدخول هنا" required><br>
            <button type="submit">دخول</button>
        </form>
    </div>
</body>
</html>
