<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - أكاديمية دقيش</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; color: #34495e; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #3498db; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #2980b9; }
        .error { color: #e74c3c; margin-bottom: 15px; font-size: 14px; }
        .toggle-link { margin-top: 15px; display: block; color: #2980b9; cursor: pointer; font-size: 14px; text-decoration: underline; }
        .teacher-btn { background-color: #27ae60; margin-top: 15px; }
        .teacher-btn:hover { background-color: #219653; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>أكاديمية دقيش التعليمية</h2>
    
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form id="codeForm" method="POST">
        <input type="hidden" name="action" value="code_login">
        <div class="form-group">
            <label>أدخل كود الدخول:</label>
            <input type="text" name="code" required placeholder="مثال: DEK-12345">
        </div>
        <button type="submit">دخول بالمنصة</button>
    </form>

    <form id="phoneForm" method="POST" class="hidden">
        <input type="hidden" name="action" value="phone_login">
        <div class="form-group">
            <label>الاسم الكامل:</label>
            <input type="text" name="student_name" required placeholder="اسم التلميذ الثلاثي">
        </div>
        <div class="form-group">
            <label>رقم الهاتف:</label>
            <input type="text" name="phone" required placeholder="رقم الهاتف المسجل">
        </div>
        <button type="submit">دخول لحسابي</button>
    </form>

    <span class="toggle-link" onclick="toggleForms()" id="toggleText">هل أنت مسجل من قبل؟ اضغط هنا للدخول بالاسم والهاتف</span>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

    <form method="POST">
        <input type="hidden" name="action" value="teacher_login">
        <div class="form-group">
            <label>أنا أستاذ (رمز المشرف):</label>
            <input type="password" name="teacher_pass" required placeholder="رمز دخول الأستاذ">
        </div>
        <button type="submit" class="teacher-btn">دخول الأستاذ</button>
    </form>
</div>

<script>
    function toggleForms() {
        const codeForm = document.getElementById('codeForm');
        const phoneForm = document.getElementById('phoneForm');
        const toggleText = document.getElementById('toggleText');

        if (codeForm.classList.contains('hidden')) {
            codeForm.classList.remove('hidden');
            phoneForm.classList.add('hidden');
            toggleText.innerText = "هل أنت مسجل من قبل؟ اضغط هنا للدخول بالاسم والهاتف";
        } else {
            codeForm.classList.add('hidden');
            phoneForm.classList.remove('hidden');
            toggleText.innerText = "العودة للدخول بكود جديد";
        }
    }
</script>

</body>
</html>
