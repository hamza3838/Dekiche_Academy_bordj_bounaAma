<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأستاذ - أكاديمية دقيش</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 20px; direction: rtl; }
        .wrapper { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
        
        .top-bar { background: #1e293b; border: 1px solid rgba(233, 189, 104, 0.2); border-radius: 16px; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .top-bar h1 { color: #e9bd68; font-size: 22px; font-weight: 700; }
        .btn-logout { background: #ef4444; color: white; padding: 8px 18px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 14px; transition: 0.2s; }
        .btn-logout:hover { background: #dc2626; }

        .card { background: #1e293b; border: 1px solid rgba(233, 189, 104, 0.2); border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .card h2 { color: #e9bd68; font-size: 18px; margin-bottom: 16px; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }

        .alert { padding: 14px 18px; border-radius: 12px; margin-bottom: 20px; font-size: 14px; font-weight: 600; }
        .alert-success { background: rgba(34, 197, 94, 0.15); border: 1px solid #22c55e; color: #86efac; }
        .alert-danger { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
        .form-group select, .form-group input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; color: #f8fafc; border-radius: 10px; font-size: 14px; outline: none; transition: 0.2s; }
        .form-group select:focus, .form-group input:focus { border-color: #e9bd68; }
        .btn-submit { background: #e9bd68; color: #0f172a; padding: 12px; border: none; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; transition: 0.2s; margin-top: 10px; }
        .btn-submit:hover { filter: brightness(1.1); }

        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: right; }
        th, td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid #334155; }
        th { color: #e9bd68; font-weight: 600; background: rgba(15, 23, 42, 0.4); }
        .empty-row { text-align: center; color: #94a3b8; padding: 30px; font-size: 14px; }
        a.link-val { color: #38bdf8; text-decoration: none; }
        a.link-val:hover { text-decoration: underline; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.2s; }
        .btn-delete:hover { background: #dc2626; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="top-bar">
            <h1>لوحة تحكم الأستاذ - إضافة الدروس</h1>
            <a href="/logout" class="btn-logout">تسجيل الخروج</a>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for cat, msg in messages %}
                    <div class="alert alert-{{ 'success' if cat == 'success' else 'danger' }}">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="card">
            <h2>إضافة درس جديد</h2>
            <form method="POST">
                <div class="form-grid">
                    <!-- اختيار الطور أولاً -->
                    <div class="form-group">
                        <label>الطور التعليمي:</label>
                        <select id="cycleSelect" onchange="updateGrades()" required>
                            <option value="">اختر الطور...</option>
                            <option value="الابتدائي">التعليم الابتدائي</option>
                            <option value="المتوسط">التعليم المتوسط</option>
                        </select>
                    </div>

                    <!-- اختيار السن الدراسي بناءً على الطور -->
                    <div class="form-group">
                        <label>السن الدراسي:</label>
                        <select name="school_year" id="gradeSelect" required>
                            <option value="">اختر الطور أولاً...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>المادة:</label>
                        <select name="subject" required>
                            <option value="اللغة العربية">اللغة العربية</option>
                            <option value="الرياضيات">الرياضيات</option>
                            <option value="الفرنسية">الفرنسية</option>
                            <option value="الإنجليزية">الإنجليزية</option>
                            <option value="الفيزياء">الفيزياء (العلوم الفيزيائية)</option>
                            <option value="العلوم الطبيعية">العلوم الطبيعية</option>
                            <option value="الاجتماعيات">الاجتماعيات</option>
                            <option value="التربية الإسلامية">التربية الإسلامية</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>الشهر:</label>
                        <select name="month" required>
                            <option value="سبتمبر">سبتمبر</option>
                            <option value="أكتوبر">أكتوبر</option>
                            <option value="نوفمبر">نوفمبر</option>
                            <option value="ديسمبر">ديسمبر</option>
                            <option value="جانفي">جانفي</option>
                            <option value="فيفري">فيفري</option>
                            <option value="مارس">مارس</option>
                            <option value="أفريل">أفريل</option>
                            <option value="ماي">ماي</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>الأسبوع:</label>
                        <select name="week" required>
                            <option value="الأسبوع الأول">الأسبوع الأول</option>
                            <option value="الأسبوع الثاني">الأسبوع الثاني</option>
                            <option value="الأسبوع الثالث">الأسبوع الثالث</option>
                            <option value="الأسبوع الرابع">الأسبوع الرابع</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid" style="grid-template-columns: 2fr 1fr;">
                    <div class="form-group">
                        <label>عنوان الدرس:</label>
                        <input type="text" name="title" placeholder="مثال: درس جمع الاعداد الطبيعية" required>
                    </div>
                    <div class="form-group">
                        <label>رقم الترتيب (الأولوية):</label>
                        <input type="number" name="lesson_order" value="0" placeholder="0" required>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>رابط الفيديو (Video URL):</label>
                        <input type="url
