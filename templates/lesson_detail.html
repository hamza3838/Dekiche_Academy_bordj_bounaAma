<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ lesson.title }} - أكاديمية دقيش</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; direction: rtl; text-align: right; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-top: 0; }
        .meta-info { background: #e9ecef; padding: 10px 15px; border-radius: 5px; margin-bottom: 20px; color: #555; font-size: 14px; }
        .video-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .description-box { line-height: 1.6; color: #444; margin-bottom: 25px; font-size: 16px; background: #f9f9f9; padding: 15px; border-radius: 5px; border: 1px solid #eee; }
        .back-btn { display: inline-block; background: #6c757d; color: white; padding: 8px 15px; text-decoration: none; border-radius: 5px; font-size: 14px; }
        .back-btn:hover { background: #5a6268; }
    </style>
</head>
<body>

<div class="container">
    <a href="/" class="back-btn">← العودة إلى قائمة الدروس</a>
    
    <h1 style="margin-top: 15px;">{{ lesson.title }}</h1>
    
    <div class="meta-info">
        <span><b>السنة الدراسية:</b> {{ lesson.grade }}</span> | 
        <span><b>المادة:</b> {{ lesson.subject }}</span>
    </div>

    <!-- صندوق عرض فيديو يوتيوب متجاوب -->
    <div class="video-container">
        <iframe src="{{ lesson.video_url }}" allowfullscreen></iframe>
    </div>

    {% if lesson.description %}
    <div class="description-box">
        <h3 style="margin-top: 0; color: #007bff;">وصف الدرس والملاحظات:</h3>
        <p>{{ lesson.description }}</p>
    </div>
    {% endif %}

</div>

</body>
</html>
