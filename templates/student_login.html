<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول التلامذة - أكاديمية دقيش</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0d6efd; --primary-dark: #0a58ca; --bg: #f4f7f6; --text: #2b2b2b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .login-card { background: white; width: 100%; max-width: 420px; padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; border-top: 5px solid var(--primary); }
        .logo-img { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; margin-bottom: 20px; border: 3px solid #e7f1ff; padding: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        h2 { color: var(--primary-dark); font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; }
        p { color: #6c757d; font-size: 0.95rem; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 20px; text-align: right; }
        label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 0.9rem; color: #444; }
        
        input[type="text"] { width: 100%; padding: 14px 15px; font-size: 1.1rem; border: 2px solid #e0e0e0; border-radius: 10px; outline: none; transition: 0.3s; text-align: center; letter-spacing: 2px; font-weight: bold; }
        input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(13,110,253,0.1); }
        
        button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; box-shadow: 0 4px 12px rgba(13,110,253,0.2); }
        button:hover { background: var(--primary-dark); transform: translateY(-2px); }
        
        .flash-msg { background: #f8d7da; color: #842029; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; border: 1px solid #f5c2c7; font-weight: 500; }
        .footer-note { margin-top: 25px; font-size: 0.85rem; color: #adb5bd; }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="{{ url_for('static', filename='Logo.png') }}" alt="شعار الأكاديمية" class="logo-img">
        <h2>بوابة التلامذة</h2>
        <p>أكاديمية دقيش - برج بوعنامة</p>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="flash-msg">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label for="code">أدخل رمز الدخول (الكود):</label>
                <input type="text" id="code" name="code" placeholder="مثال: 12345" required autocomplete="off">
            </div>
            <button type="submit">دخول إلى دروسي</button>
        </form>

        <div class="footer-note">
            إذا واجهتك مشكلة في الكود، تواصل مع الأستاذ حمزة.
        </div>
    </div>

</body>
</html>
