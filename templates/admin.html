<!-- نموذج إضافة درس مع تحديد السنة والمادة -->
<div class="section">
    <h2>إضافة درس جديد</h2>
    <form method="POST" action="/admin/add_lesson">
        <input type="text" name="title" placeholder="عنوان الدرس" required>
        <input type="text" name="youtube_url" placeholder="رابط يوتيوب (Embed)" required>
        <input type="text" name="grade" placeholder="السنة الدراسية (مثلاً: الخامسة ابتدائي)" required>
        <input type="text" name="subject" placeholder="المادة (مثلاً: رياضيات / لغة عربية)" required>
        <select name="lesson_month">
            <option value="1">الشهر الأول</option>
            <option value="2">الشهر الثاني</option>
            <!-- باقي الشهور -->
        </select>
        <input type="number" name="order_index" placeholder="رتبة الدرس" value="0">
        <button type="submit">إضافة الدرس</button>
    </form>
</div>

<!-- نموذج توليد أكواد عشوائية دفعة واحدة -->
<div class="section">
    <h2>توليد دفعة أكواد تفعيل عشوائية</h2>
    <form method="POST" action="/admin/generate_batch_codes">
        <select name="code_month">
            <option value="1">الشهر الأول</option>
            <option value="2">الشهر الثاني</option>
            <!-- باقي الشهور -->
        </select>
        <input type="number" name="count" placeholder="عدد الأكواد المطلوبة (مثلاً 20)" value="10" required>
        <button type="submit" style="background: #34a853;">توليد الأكواد دفعة واحدة</button>
    </form>
</div>

<!-- عرض جميع الدروس مرتبطة حسب السنة والمادة -->
<div class="section">
    <h2>جميع الدروس المسجلة (حسب السنة والمادة)</h2>
    <table>
        <thead>
            <tr>
                <th>السنة الدراسية</th>
                <th>المادة</th>
                <th>الشهر</th>
                <th>عنوان الدرس</th>
                <th>الترتيب</th>
            </tr>
        </thead>
        <tbody>
            {% for lesson in lessons %}
            <tr>
                <td>{{ lesson.grade }}</td>
                <td>{{ lesson.subject }}</td>
                <td>الشهر {{ lesson.lesson_month }}</td>
                <td>{{ lesson.title }}</td>
                <td>{{ lesson.order_index }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
