<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الأساتذة - أكاديمية دقيش</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { 
            background: #0f172a; 
            color: #f8fafc; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
            direction: rtl; 
        }
        .login-card { 
            width: 100%; 
            max-width: 450px; 
            background: #1e293b; 
            border: 1px solid rgba(233, 189, 104, 0.25); 
            border-radius: 20px; 
            padding: 35px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0; left: 0;
            height: 5px;
            background: linear-gradient(90deg, #7c3aed, #e9bd68);
        }
        
        .logo-box { text-align: center; margin-bottom: 20px; }
        .logo-box img { max-width: 130px; height: auto; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3)); }
        
        .title-area h2 { color: #e9bd68; font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 6px; }
        .title-area p { color: #94a3b8; font-size: 13px; text-align: center; margin-bottom: 25px; }

        /* التنبيهات */
        .alert { padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 13px; font-weight: 600; text-align: center; }
        .alert-danger { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; }

        .form-group { margin-bottom: 20px; text-align: right; }
        .form-group label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; font-weight: 600; }
        .form-group input { width: 100%; padding: 12px 15px; background: #0f172a; border: 1px solid #334155; color: #f8fafc; border-radius: 10px; font-size: 14px; outline: none; transition: 0.2s; text-align: center; letter-spacing: 2px; }
        .form-group input:focus { border-color: #e9bd68; box-shadow: 0 0 0 3px rgba(233, 189, 104, 0.15); }

        .btn-submit { width: 100%; background: #e9bd68; color: #0f172a; padding: 13px; border: none; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { filter: brightness(1.1); transform: translateY(-1px); }

        .back-link { display: block; text-align: center; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 13px; font-weight: 600; transition: 0.2s; }
        .back-link:hover { color: #e9bd68; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-box">
            <img src="{{ url_for('static', filename='Logo.png') }}" alt="شعار أكاديمية دقيش التعليمية">
        </div>
        
        <div class="title-area">
            <h2>بوابة دخول الأساتذة</h2>
            <p>أدخل كلمة المرور الخاصة بلوحة تحكم الأساتذة</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>كلمة مرور الأستاذ:</label>
                <input type="password" name="password" required placeholder="••••••••••••" autofocus>
            </div>
            
            <button type="submit" class="btn-submit">تسجيل الدخول</button>
        </form>

        <a href="{{ url_for('home') }}" class="back-link">← العودة إلى الصفحة الرئيسية</a>
    </div>
</body>
</html>
